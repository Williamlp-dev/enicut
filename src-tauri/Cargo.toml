[package]
name = "enicut"
version = "0.2.0"
description = "Cortador de vídeos rápido"
authors = ["William Lopes"]
edition = "2021"

[[bin]]
name = "ENICUT"
path = "src/main.rs"


[lib]
name = "enicut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
window-vibrancy = "0.5"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tauri-plugin-single-instance = "2"
mp4 = "0.14"

# Windows Media Foundation — substitui ffprobe sem binários externos.
# Versão 0.61 alinhada com a que o Tauri já usa internamente,
# evitando dois exemplares de windows no grafo e conflitos de tipo.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Editing",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

# 🚀 Otimizações de tamanho para a Build de Produção (Release)
[profile.release]
panic = "abort"      # Remove informações pesadas de rastreamento de erros (stack unwinding)
codegen-units = 1    # Compila tudo de uma vez (mais lento, mas gera código menor e mais otimizado)
lto = true           # Link-Time Optimization (otimiza todo o código do projeto junto removendo o que não é usado)
opt-level = "s"      # Otimiza o compilador focando no Tamanho (Size) ao invés de velocidade extrema
strip = true         # Remove símbolos de debug nativos do Windows (reduz drasticamente o .exe)

