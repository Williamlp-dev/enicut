[package]
name = "enicut"
version = "0.1.0"
description = "ENICUT — fast video cutter"
authors = ["Williamlp-dev"]
edition = "2021"

[[bin]]
name = "ENICUT"
path = "src/main.rs"


[lib]
name = "enicut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
window-vibrancy = "0.5"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

# 🚀 Otimizações de tamanho para a Build de Produção (Release)
[profile.release]
panic = "abort"      # Remove informações pesadas de rastreamento de erros (stack unwinding)
codegen-units = 1    # Compila tudo de uma vez (mais lento, mas gera código menor e mais otimizado)
lto = true           # Link-Time Optimization (otimiza todo o código do projeto junto removendo o que não é usado)
opt-level = "s"      # Otimiza o compilador focando no Tamanho (Size) ao invés de velocidade extrema
strip = true         # Remove símbolos de debug nativos do Windows (reduz drasticamente o .exe)

